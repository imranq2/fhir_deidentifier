  hapi-fhir:
    image: hapiproject/hapi:v8.4.0-2
    ports:
      - "8080:8080"
    environment:
      - spring.datasource.url=jdbc:h2:mem:test_mem
      - JAVA_OPTS=-Xmx1024m
      - hapi.fhir.enable_repository_validating_interceptor=true
      # US Core 6.1.0 IG auto-install (no packageUrl!)
      - hapi.fhir.implementationguides.uscore610.name=hl7.fhir.us.core
      - hapi.fhir.implementationguides.uscore610.version=6.1.0
      - hapi.fhir.implementationguides.uscore610.installMode=STORE_AND_INSTALL

    #    healthcheck:
    #      test: ["CMD", "curl", "--fail", "-s", "http://localhost:8080/actuator/health"]
    #      interval: 20s
    #      timeout: 20s
    #      retries: 3
    #      start_period: 60s
    networks:
      - fhirnet

  validate-script:
    #    depends_on:
    #      fhir-validator:
    #        condition: service_healthy
    #      hapi-fhir:
    #        condition: service_healthy
    image: python:3.12-slim
    volumes:
      - ./profiles:/profiles
      - ./scripts:/app
      - ./data/output/large:/data/output/large
      - ./data/validation_result:/validation_result
    working_dir: /app
    command: [ "tail", "-f", "/dev/null" ]
    #    command: ["/bin/sh", "-c", "pip install requests && python validate.py /data/output/large"]
    networks:
      - fhirnet

networks:
  fhirnet:
    driver: bridge
